name: Desktop Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Workflow to build desktop installers and attach them to GitHub Release
# 
# Version bump process:
# 1. Manually bump version: npm run version:bump (prompts: breaking/feature/bugfix)
# 2. Creates commit: "chore(release): bump version to X.Y.Z"
# 3. Create tag: git tag vX.Y.Z
# 4. Push tag: git push origin vX.Y.Z
# 5. This workflow triggers automatically:
#    - Builds desktop installers for Windows, macOS, Linux (matrix strategy)
#    - Uploads all installers as Release Assets to the GitHub Release
#    - Single release created (avoided per-matrix duplication via needs: and if condition)

jobs:
  build-desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build desktop for Windows
        if: matrix.os == 'windows-latest'
        run: npm run desktop:dist:win
        
      - name: Build desktop for macOS
        if: matrix.os == 'macos-latest'
        run: npm run desktop:dist:mac
        
      - name: Build desktop for Linux
        if: matrix.os == 'ubuntu-latest'
        run: npm run desktop:dist:linux

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist-desktop/
          retention-days: 5
          if-no-files-found: warn

      - name: Upload artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: dist-desktop/
          retention-days: 5
          if-no-files-found: warn

      - name: Upload artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: dist-desktop/
          retention-days: 5
          if-no-files-found: warn

  create-release:
    # Only run once all matrix builds are done
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f -exec ls -lh {} \;

      - name: Create GitHub Release with Assets
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
