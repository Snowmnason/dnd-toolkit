name: Config Schema Validation

on:
  pull_request:
    paths:
      - 'config/appsettings.json'
      - 'config/appsettings.dev.json'
      - 'lib/config/tools/**'
  push:
    branches:
      - main
      - develop
    paths:
      - 'config/appsettings.json'
      - 'config/appsettings.dev.json'
      - 'lib/config/tools/**'

jobs:
  validate-config:
    runs-on: ubuntu-latest
    name: Validate Config Schema

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate config schema
        run: npm run config:validate
        env:
          STRICT_CONFIG_VALIDATION: '1'

      - name: Report results
        if: failure()
        run: |
          echo "❌ Config schema validation failed"
          echo "Check the output above for missing/extra fields"
          exit 1
