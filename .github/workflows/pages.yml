name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Auto-Bump Version on PR Merge or Main Push"
      - "Milestone Release (Bump Major Version & Deploy)"
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Only run after successful auto-bump workflow completion
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Wait for pending bump/milestone workflows
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflows = ['auto-version-bump.yml', 'milestone-release.yml'];
            const intervalMs = 10000; // 10s
            const timeoutMs = 15 * 60 * 1000; // 15 minutes
            const start = Date.now();

            async function hasActiveRuns(workflowId) {
              const inProgress = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: workflowId, branch: 'main', status: 'in_progress' });
              const queued = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: workflowId, branch: 'main', status: 'queued' });
              return (inProgress.data.workflow_runs?.length || 0) > 0 || (queued.data.workflow_runs?.length || 0) > 0;
            }

            async function waitForIdle() {
              while (true) {
                let busy = false;
                for (const wf of workflows) {
                  if (await hasActiveRuns(wf)) {
                    busy = true;
                    break;
                  }
                }

                if (!busy) {
                  core.info('No active auto-bump or milestone workflows on main. Proceeding to deploy.');
                  return;
                }

                if (Date.now() - start > timeoutMs) {
                  core.setFailed('Timeout waiting for auto-bump/milestone workflows to finish.');
                  return;
                }

                core.info('Waiting for auto-bump/milestone workflows to finish...');
                await new Promise(r => setTimeout(r, intervalMs));
              }
            }

            await waitForIdle();

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # Always checkout latest main (includes version bump commit)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web export
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          echo "Checking Supabase envs for web build (pages)"
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] ; then echo "MISSING EXPO_PUBLIC_SUPABASE_URL"; else echo "EXPO_PUBLIC_SUPABASE_URL length: ${#EXPO_PUBLIC_SUPABASE_URL}"; fi
          if [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ] ; then echo "MISSING EXPO_PUBLIC_SUPABASE_ANON_KEY"; else echo "EXPO_PUBLIC_SUPABASE_ANON_KEY length: ${#EXPO_PUBLIC_SUPABASE_ANON_KEY}"; fi
          npm run predeploy

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
