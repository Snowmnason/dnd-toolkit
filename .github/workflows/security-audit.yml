# Security Audit Workflow
# Runs dependency vulnerability scans on pushes and PRs
#
# This helps catch security issues in dependencies before they reach production

name: Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly security audit on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm run audit
        continue-on-error: true

      - name: Run critical vulnerability check
        run: npm run audit:critical
        continue-on-error: true

      - name: Comment on PR (if vulnerabilities found)
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Security Alert**: Vulnerabilities detected in dependencies. Please review the security audit results above and consider running `npm audit fix` or updating vulnerable packages.'
            })