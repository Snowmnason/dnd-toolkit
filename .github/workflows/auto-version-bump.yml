
name: Auto-Bump Version on Main Push

on:
  push:
    branches: [main]

jobs:

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      - name: Bump version based on commit message
        run: |
          # Get latest commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Latest commit message: $COMMIT_MSG"

          # Read current package.json version
          CURRENT_VERSION=$(jq -r '.version' package.json)
          echo "Current version: $CURRENT_VERSION"

          # Parse version parts (X.Y.Z)
          IFS='.' read -r X Y Z <<< "$CURRENT_VERSION"

          # Decide bump type
          if [[ "$COMMIT_MSG" == feat:* ]]; then
            Y=$((Y + 1))
            Z=0
            BUMP_TYPE="minor"
          else
            Z=$((Z + 1))
            BUMP_TYPE="patch"
          fi

          NEW_VERSION="$X.$Y.$Z"
          echo "New version: $NEW_VERSION"

          # Update package.json
          jq ".version = \"$NEW_VERSION\"" package.json > package.json.tmp
          mv package.json.tmp package.json

          # Update app.json (Expo config)
          jq ".expo.version = \"$NEW_VERSION\"" app.json > app.json.tmp
          mv app.json.tmp app.json

          # Update desktop/package.json
          jq ".version = \"$NEW_VERSION\"" desktop/package.json > desktop/package.json.tmp
          mv desktop/package.json.tmp desktop/package.json

          echo "new_version=$NEW_VERSION" >> $GITHUB_ENV
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_ENV
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_ENV

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json app.json desktop/package.json
          git commit -m "chore(release): bump version ${{ env.current_version }} → ${{ env.new_version }} (patch)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
