name: Auto-Bump Version on PR Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  bump-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine version bump type and update
        run: |
          # Get PR labels as JSON
          LABELS=$(echo '${{ toJson(github.event.pull_request.labels) }}' | jq -r '.[].name')
          
          echo "PR Labels: $LABELS"
          
          # Determine version part to bump based on label
          BUMP_TYPE="bug"
          if echo "$LABELS" | grep -iq "feature\|enhancement"; then
            BUMP_TYPE="feature"
            echo "Label: feature/enhancement -> bump Y"
          else
            BUMP_TYPE="bug"
            echo "Label: bug (or default) -> bump Z"
          fi
          
          # Read current package.json version
          CURRENT_VERSION=$(jq -r '.version' package.json)
          echo "Current version: $CURRENT_VERSION"
          
          # Parse version parts (X.Y.Z)
          IFS='.' read -r X Y Z <<< "$CURRENT_VERSION"
          
          # Bump the appropriate part
          case "$BUMP_TYPE" in
            feature)
              Y=$((Y + 1))
              Z=0
              ;;
            bug)
              Z=$((Z + 1))
              ;;
          esac
          
          NEW_VERSION="$X.$Y.$Z"
          echo "New version: $NEW_VERSION"
          
          # Update package.json
          jq ".version = \"$NEW_VERSION\"" package.json > package.json.tmp
          mv package.json.tmp package.json
          
          # Update app.json (Expo config)
          jq ".expo.version = \"$NEW_VERSION\"" app.json > app.json.tmp
          mv app.json.tmp app.json
          
          # Update desktop/package.json
          jq ".version = \"$NEW_VERSION\"" desktop/package.json > desktop/package.json.tmp
          mv desktop/package.json.tmp desktop/package.json
          
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_ENV
          echo "new_version=$NEW_VERSION" >> $GITHUB_ENV
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_ENV

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json app.json desktop/package.json
          git commit -m "chore(release): bump version ${{ env.current_version }} → ${{ env.new_version }} (${{ env.bump_type }})"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Version bumped: **${{ env.current_version }}** → **${{ env.new_version }}** (${{ env.bump_type }})`
            })
