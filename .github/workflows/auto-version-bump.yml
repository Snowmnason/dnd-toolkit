
name: Auto-Bump Version on PR Merge or Main Push

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    branches: [main]

jobs:
  bump-version:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, 'chore(release): bump version'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine bump type and update version
        run: |
          # Get commit message (different for PR vs push)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # For PR merges, use PR title as commit message
            COMMIT_MSG="${{ github.event.pull_request.title }}"
            echo "PR merge detected. Using PR title: $COMMIT_MSG"
          else
            # For direct pushes (rare hotfixes), always bump patch
            echo "Direct push to main detected - treating as hotfix, always bumping patch"
            COMMIT_MSG="hotfix"
          fi

          # Read current package.json version
          CURRENT_VERSION=$(jq -r '.version' package.json)
          echo "Current version: $CURRENT_VERSION"

          # Parse version parts (X.Y.Z)
          IFS='.' read -r X Y Z <<< "$CURRENT_VERSION"

          # Decide bump type based on commit/PR title
          if [[ "$COMMIT_MSG" == feat:* ]] || [[ "$COMMIT_MSG" == enhancement:* ]]; then
            Y=$((Y + 1))
            Z=0
            BUMP_TYPE="minor"
            echo "Detected feature/enhancement -> bumping Y (minor)"
          else
            Z=$((Z + 1))
            BUMP_TYPE="patch"
            echo "Detected fix/patch/hotfix -> bumping Z (patch)"
          fi

          NEW_VERSION="$X.$Y.$Z"
          echo "New version: $NEW_VERSION"

          # Update package.json
          jq ".version = \"$NEW_VERSION\"" package.json > package.json.tmp
          mv package.json.tmp package.json

          # Update app.json (Expo config)
          jq ".expo.version = \"$NEW_VERSION\"" app.json > app.json.tmp
          mv app.json.tmp app.json

          # Update desktop/package.json
          jq ".version = \"$NEW_VERSION\"" desktop/package.json > desktop/package.json.tmp
          mv desktop/package.json.tmp desktop/package.json

          echo "new_version=$NEW_VERSION" >> $GITHUB_ENV
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_ENV
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_ENV

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json app.json desktop/package.json
          git commit -m "chore(release): bump version ${{ env.current_version }} → ${{ env.new_version }} (${{ env.bump_type }})"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR (if PR merge)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Version bumped: **${{ env.current_version }}** → **${{ env.new_version }}** (${{ env.bump_type }})`
            })
